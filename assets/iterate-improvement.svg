<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="-apple-system, 'Segoe UI', sans-serif">
  <style>
    .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
    .subtitle { font-size: 12px; fill: #666; }
    .label { font-size: 12px; fill: #333; text-anchor: end; }
    .value { font-size: 11px; fill: #333; font-variant-numeric: tabular-nums; }
    .delta { font-size: 11px; font-weight: 600; fill: #0a7f3f; font-variant-numeric: tabular-nums; }
    .axis { font-size: 10px; fill: #888; }
    .grid { stroke: #eee; stroke-width: 1; }
    .bar-init { fill: #cfe2ff; }
    .bar-delta { fill: #0d6efd; }
    .threshold { stroke: #dc3545; stroke-width: 1; stroke-dasharray: 4 3; }
    .threshold-label { font-size: 10px; fill: #dc3545; font-weight: 600; }
  </style>

  <!-- Title -->
  <text x="20" y="28" class="title">Evaluator-Optimizer Loop: Match Rate Improvement</text>
  <text x="20" y="46" class="subtitle">9 iterate cycles · avg 75.1% to 95.9% (+20.8p) · 1.22 iterations on average</text>

  <!-- Chart area: x = 240..680 (440px = 100%) -->
  <!-- Grid lines & x-axis labels -->
  <g>
    <line x1="240" y1="70" x2="240" y2="400" class="grid"/>
    <line x1="328" y1="70" x2="328" y2="400" class="grid"/>
    <line x1="416" y1="70" x2="416" y2="400" class="grid"/>
    <line x1="504" y1="70" x2="504" y2="400" class="grid"/>
    <line x1="592" y1="70" x2="592" y2="400" class="grid"/>
    <line x1="680" y1="70" x2="680" y2="400" class="grid"/>
    <text x="240" y="416" class="axis" text-anchor="middle">0%</text>
    <text x="328" y="416" class="axis" text-anchor="middle">20%</text>
    <text x="416" y="416" class="axis" text-anchor="middle">40%</text>
    <text x="504" y="416" class="axis" text-anchor="middle">60%</text>
    <text x="592" y="416" class="axis" text-anchor="middle">80%</text>
    <text x="680" y="416" class="axis" text-anchor="middle">100%</text>
  </g>

  <!-- 90% threshold -->
  <line x1="636" y1="70" x2="636" y2="400" class="threshold"/>
  <text x="636" y="64" class="threshold-label" text-anchor="middle">90% target</text>

  <!-- Bars: y starts at 78, height 24, gap 12, 9 rows total -->
  <!-- 47 -> 98 (+51) -->
  <g>
    <text x="232" y="94" class="label">content-quality-audit</text>
    <rect x="240" y="82" width="206.8" height="20" class="bar-init"/>
    <rect x="446.8" y="82" width="224.4" height="20" class="bar-delta"/>
    <text x="680" y="96" class="value" text-anchor="end" fill="white">47% to 98%</text>
    <text x="700" y="96" class="delta">+51p</text>
  </g>
  <!-- 68 -> 92 (+24) -->
  <g>
    <text x="232" y="124" class="label">ux-content-audit (02)</text>
    <rect x="240" y="112" width="299.2" height="20" class="bar-init"/>
    <rect x="539.2" y="112" width="105.6" height="20" class="bar-delta"/>
    <text x="640" y="126" class="value" text-anchor="end" fill="white">68% to 92%</text>
    <text x="700" y="126" class="delta">+24p</text>
  </g>
  <!-- 65 -> 92 (+27) -->
  <g>
    <text x="232" y="154" class="label">content-hub-update</text>
    <rect x="240" y="142" width="286" height="20" class="bar-init"/>
    <rect x="526" y="142" width="118.8" height="20" class="bar-delta"/>
    <text x="640" y="156" class="value" text-anchor="end" fill="white">65% to 92%</text>
    <text x="700" y="156" class="delta">+27p</text>
  </g>
  <!-- 67 -> 100 (+33) -->
  <g>
    <text x="232" y="184" class="label">guides-intermediate-quality</text>
    <rect x="240" y="172" width="294.8" height="20" class="bar-init"/>
    <rect x="534.8" y="172" width="145.2" height="20" class="bar-delta"/>
    <text x="676" y="186" class="value" text-anchor="end" fill="white">67% to 100%</text>
    <text x="700" y="186" class="delta">+33p</text>
  </g>
  <!-- 82 -> 96 (+14) -->
  <g>
    <text x="232" y="214" class="label">design-system</text>
    <rect x="240" y="202" width="360.8" height="20" class="bar-init"/>
    <rect x="600.8" y="202" width="61.6" height="20" class="bar-delta"/>
    <text x="658" y="216" class="value" text-anchor="end" fill="white">82% to 96%</text>
    <text x="700" y="216" class="delta">+14p</text>
  </g>
  <!-- 84 -> 100 (+16) -->
  <g>
    <text x="232" y="244" class="label">link-validation</text>
    <rect x="240" y="232" width="369.6" height="20" class="bar-init"/>
    <rect x="609.6" y="232" width="70.4" height="20" class="bar-delta"/>
    <text x="676" y="246" class="value" text-anchor="end" fill="white">84% to 100%</text>
    <text x="700" y="246" class="delta">+16p</text>
  </g>
  <!-- 85 -> 96 (+11) -->
  <g>
    <text x="232" y="274" class="label">guides-advanced-quality</text>
    <rect x="240" y="262" width="374" height="20" class="bar-init"/>
    <rect x="614" y="262" width="48.4" height="20" class="bar-delta"/>
    <text x="658" y="276" class="value" text-anchor="end" fill="white">85% to 96%</text>
    <text x="700" y="276" class="delta">+11p</text>
  </g>
  <!-- 87 -> 92 (+5) -->
  <g>
    <text x="232" y="304" class="label">problem-analysis</text>
    <rect x="240" y="292" width="382.8" height="20" class="bar-init"/>
    <rect x="622.8" y="292" width="22" height="20" class="bar-delta"/>
    <text x="640" y="306" class="value" text-anchor="end" fill="white">87% to 92%</text>
    <text x="700" y="306" class="delta">+5p</text>
  </g>
  <!-- 91 -> 97 (+6) -->
  <g>
    <text x="232" y="334" class="label">readme-awesome</text>
    <rect x="240" y="322" width="400.4" height="20" class="bar-init"/>
    <rect x="640.4" y="322" width="26.4" height="20" class="bar-delta"/>
    <text x="664" y="336" class="value" text-anchor="end" fill="white">91% to 97%</text>
    <text x="700" y="336" class="delta">+6p</text>
  </g>

  <!-- Avg row -->
  <g>
    <line x1="240" y1="358" x2="680" y2="358" class="grid"/>
    <text x="232" y="380" class="label" font-weight="700">AVERAGE</text>
    <rect x="240" y="368" width="330.44" height="20" class="bar-init" opacity="0.5"/>
    <rect x="570.44" y="368" width="91.52" height="20" class="bar-delta" opacity="0.7"/>
    <text x="658" y="382" class="value" text-anchor="end" fill="#1a1a1a" font-weight="700">75.1% to 95.9%</text>
    <text x="700" y="382" class="delta" font-weight="700">+20.8p</text>
  </g>

  <!-- Legend -->
  <g transform="translate(20, 440)">
    <rect x="0" y="-9" width="12" height="12" class="bar-init"/>
    <text x="18" y="0" class="axis" font-size="11">Initial match rate</text>
    <rect x="140" y="-9" width="12" height="12" class="bar-delta"/>
    <text x="158" y="0" class="axis" font-size="11">Improvement after iterate</text>
    <line x1="340" y1="-3" x2="356" y2="-3" class="threshold"/>
    <text x="362" y="0" class="axis" font-size="11">90% quality target</text>
  </g>
</svg>
